<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StruXtor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="bg-glow-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Historique</h3>
                <button id="clear-history" title="Tout effacer">
                    <i data-lucide="trash-2"></i>
                </button>
            </div>
            <div id="history-list">
                <div class="empty-history">
                    <i data-lucide="compass" class="empty-icon"></i>
                    <p>Aucun historique</p>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <div id="header">
                <button id="sidebar-toggle" title="Basculer l'historique">
                    <i data-lucide="menu"></i>
                </button>
                <div class="brand-container">
                    <img src="Assets/logo.png" id="logo" alt="logo" onerror="this.style.display='none'">
                    <h1 id="title">StruXtor</h1>
                </div>
            </div>
            
            <div class="content-body">
                <div class="filter-panel">
                    <div class="filter-header">
                        <i data-lucide="sliders-horizontal" class="filter-icon"></i>
                        <span>Filtres d'exclusion</span>
                    </div>
                    <div class="filter-options">
                        <label class="switch-container">
                            <input type="checkbox" id="filter-dev" checked>
                            <span class="slider"></span>
                            <span class="label-text">Ignorer les dossiers de dev <small>(node_modules, .git, dist...)</small></span>
                        </label>
                    </div>
                </div>

                <div id="middler">
                    <div class="interactive-border"></div>
                    <div class="drop-zone-content">
                        <div id="import-btn">
                            <div class="icon-wrapper">
                                <i data-lucide="plus" class="upload-icon"></i>
                            </div>
                        </div>
                        <h2 id="import-txt">Déposer un dossier</h2>
                        <p id="app-desc">Générez instantanément une arborescence textuelle épurée.</p>
                    </div>
                    <input type="file" id="folderInput" webkitdirectory multiple style="display:none">
                </div>
                
                <div id="loading-container" style="display: none;">
                    <div class="loader-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div id="loading-text">Analyse des fichiers...</div>
                    <div id="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                    <div id="file-count">0 fichier détecté</div>
                </div>
                
                <div id="structure-output"></div>
            </div>
        </main>
    </div>

    <script>
        // Initialisation initiale des icônes Lucide
        lucide.createIcons();
    </script>
    <script src="script.js"></script>
</body>
</html>
